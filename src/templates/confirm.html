<div class="modal-dialog">
    <div class="modal-content">
        <div class="modal-header">
            <h3><%=config.title%></h3>
            <% if (config.closable) { %><button type="button" class="btn-close" data-bs-dismiss="modal"></button><% } %>
        </div>
        <div class="modal-body">
            <p><%=config.message%></p>
        </div>
        <% if (config.showButtons) { %>
            <div class="modal-footer">
                <button type="button" class="btn <%-config.okClass%> okButton" data-bs-dismiss="modal"><i class="<%-config.okIcon%>"></i> <%=config.okText%></button>
                <button type="button" class="btn <%-config.cancelClass%> cancelButton" data-bs-dismiss="modal"><i class="<%-config.cancelIcon%>"></i> <%=config.cancelText%></button>
            </div>
        <% } else if (config.closable) { %>
            <div class="modal-footer">
                <a href="#" class="btn <%-config.okClass%> okButton" data-bs-dismiss="modal"><i class="<%-config.okIcon%>"></i> <%=config.okText%></a>
            </div>
        <% } %>
    </div>
</div>
