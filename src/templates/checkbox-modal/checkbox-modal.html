<div class="modal fade">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h3><%= i18n[modalHeader] %></h3>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <%_.each(tableConfigs, function(tableConfig) {%>
                    <%= tableTemplate(tableConfig) %>
                <%})%>
            </div>
            <div class="modal-footer">
                <button class="btn <%=okClass%> ok"><i class="<%=okIcon%>"></i> <%=i18n['app.ok']%> </button>
                <button class="btn <%=cancelClass%>" data-bs-dismiss="modal" aria-hidden="true"><i class="fa fa-remove"></i> <%=i18n['app.cancel']%> </button>
            </div>
        </div>
    </div>
</div>
