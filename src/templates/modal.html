<div class="modal-dialog">
  <div class="modal-content">
    <div class="modal-header">
      <h4 class="modal-title"><%-title%></h4>
      <button type="button" class="btn-close" data-bs-dismiss="modal"
              aria-label="<%=secondaryButtonText%>"></button>
    </div>
    <div class="modal-body"></div>
    <% if (showFooter) { %>
      <div class="modal-footer">
        <% if(actionButtonText) { %>
          <button type="button" class="btn btn-w-m modal-action-button <%=actionButtonClass%>"><%-actionButtonText%></button>
        <% } %>
        <button type="button" class="btn btn-white btn-w-m" data-bs-dismiss="modal"><%=secondaryButtonText%></button>
      </div>
    <% } %>
  </div>
</div>
